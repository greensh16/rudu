[package]
# Published to crates.io as `rudu-hpc`: the name `rudu` was already taken by an
# unrelated crate. The *binary* and *library* are still called `rudu` (see the
# [lib] and [[bin]] sections below), so the command users type, and the
# `use rudu::...` paths in tests and benches, are unchanged.
name = "rudu-hpc"
version = "1.5.0"
authors = ["Sam Green"]
edition = "2024"
description = "A fast, parallel replacement for du, with incremental caching, memory limits, and access-age reporting for HPC scratch filesystems"
repository = "https://github.com/greensh16/rudu"
homepage = "https://github.com/greensh16/rudu"
documentation = "https://github.com/greensh16/rudu/wiki"
readme = "README.md"
license = "GPL-3.0-only"
keywords = ["du", "disk-usage", "filesystem", "cli", "hpc"]
categories = ["command-line-utilities", "filesystem"]
exclude = [
    ".github/*",
    # Internal code-review notes: useful in the repo, noise in a published crate.
    "PARALLELISM_REVIEW.md",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Keep the library crate named `rudu` despite the package rename, so every
# `use rudu::...` in tests, benches, and examples keeps working.
[lib]
name = "rudu"
path = "src/lib.rs"

# Keep the installed command named `rudu`, not `rudu-hpc`.
[[bin]]
name = "rudu"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
walkdir = "2.5"
rayon = "1"
humansize = "2"
libc = "0.2"
globset = "0.4"
indicatif = "0.17"
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
anyhow = "1.0"
dashmap = "6.1"
num_cpus = "1.16"
serde_json = "1.0"
sysinfo = "0.30"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
strip = true

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.8"
# Integration tests link only against the rudu lib and dev-deps, so the
# access-time tests need their own libc handle to backdate atimes via utimes.
libc = "0.2"
walkdir = "2.5"
# Memory benchmarking - using criterion fork with memory tracking
# criterion-memtrack = { git = "https://github.com/jemalloc/criterion-memtrack" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
procfs = "0.16"

[[bench]]
name = "scan_benchmark"
harness = false

[[bench]]
name = "profiling"
harness = false

[[bench]]
name = "thread_pool_benchmark"
harness = false

[[bench]]
name = "work_stealing_benchmark"
harness = false

[[bench]]
name = "memory_benchmark"
harness = false

[[bench]]
name = "overhead_benchmark"
harness = false
