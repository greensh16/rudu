<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="generator" content="rudu">
<title>__RUDU_REPORT_TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Generated by `rudu --report`. Layout: one reading column; summary tiles →
   source strip → owner chart (storage | inodes) → full table. The fonts fall
   back to system fonts when the page is opened offline. */
*, *::before, *::after { box-sizing: border-box; }
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #6f6e69;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --ring: rgba(11,11,11,0.10);
  --accent: #2a78d6;
  --chip-bg: #fff3d6;
  --chip-ink: #6b4a00;
  --chip-bg-2: #e8f0fb;
  --chip-ink-2: #184f95;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4;
  --s6: #008300; --s7: #4a3aa7; --s8: #e34948; --other: #9a9890;
  --recent: #2a78d6; --stale: #86b6ef;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #9a9890;
    --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10); --accent: #3987e5;
    --chip-bg: #3a2c08; --chip-ink: #f5c95c; --chip-bg-2: #13284a; --chip-ink-2: #9ec5f4;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
    --s6: #008300; --s7: #9085e9; --s8: #e66767; --other: #6f6e69;
    --recent: #3987e5; --stale: #184f95;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #9a9890;
  --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10); --accent: #3987e5;
  --chip-bg: #3a2c08; --chip-ink: #f5c95c; --chip-bg-2: #13284a; --chip-ink-2: #9ec5f4;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
  --s6: #008300; --s7: #9085e9; --s8: #e66767; --other: #6f6e69;
  --recent: #3987e5; --stale: #184f95;
  color-scheme: dark;
}
body { margin: 0; background: var(--page); color: var(--ink); font: 400 15px/1.5 var(--sans); }
.wrap { max-width: 1040px; margin: 0 auto; padding-inline: 16px; padding-block: 32px 64px; display: grid; gap: 40px; }
header { display: grid; gap: 8px; }
.eyebrow { font: 500 12px/1.4 var(--mono); color: var(--muted); letter-spacing: 0.02em; overflow-wrap: anywhere; }
h1 { font: 600 clamp(28px, 4.5vw, 40px)/1.1 var(--sans); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font: 600 20px/1.25 var(--sans); margin: 0; text-wrap: balance; }
.lede { color: var(--ink-2); max-width: 65ch; margin: 0; }
.mono { font-family: var(--mono); }
.warn { background: var(--chip-bg); color: var(--chip-ink); border-radius: 10px; padding: 12px 16px; font-size: 14px; }
.warn[hidden] { display: none; }

.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 720px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tile { background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; padding: 14px 16px; display: grid; gap: 2px; min-width: 0; }
.tile .label { font-size: 13px; color: var(--ink-2); }
.tile .value { font-size: 28px; font-weight: 600; line-height: 1.2; }
.tile .sub { font-size: 12px; color: var(--muted); }

section { display: grid; gap: 16px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 20px; display: grid; gap: 16px; min-width: 0; }
@media (max-width: 520px) { .panel { padding: 14px; } }

/* Source strip */
.projects { display: grid; gap: 10px; }
.prow { display: grid; grid-template-columns: minmax(56px, max-content) minmax(0, 1fr) 150px; gap: 12px; align-items: center; }
@media (max-width: 520px) { .prow { grid-template-columns: minmax(48px, max-content) minmax(0, 1fr) 96px; gap: 8px; } }
.pname { font: 500 14px var(--mono); display: flex; align-items: center; gap: 6px; }
.sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.pnum { font-size: 13px; color: var(--ink-2); text-align: right; font-variant-numeric: tabular-nums; line-height: 1.3; }
.pnum b { color: var(--ink); font-weight: 600; }

/* Controls */
.controls { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--axis); border-radius: 8px; padding: 2px; gap: 2px; }
.seg button { font: 500 13px var(--sans); color: var(--ink-2); background: transparent; border: 0; border-radius: 6px; padding: 5px 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.seg button:focus-visible, .search:focus-visible, th button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.search { font: 400 14px var(--mono); color: var(--ink); background: var(--page); border: 1px solid var(--axis); border-radius: 8px; padding: 6px 10px; width: 180px; max-width: 100%; }
.ctl-label { font-size: 12px; color: var(--muted); margin-right: 4px; }
.ctl { display: inline-flex; align-items: center; }
.ctl[hidden] { display: none; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* Bar chart */
.chart { display: grid; gap: 0; min-width: 0; }
.row, .axis { display: grid; grid-template-columns: 76px minmax(0, 1fr) 132px; gap: 12px; align-items: center; }
@media (max-width: 520px) { .row, .axis { grid-template-columns: 64px minmax(0, 1fr) 84px; gap: 8px; } }
.axis { height: 22px; }
.ticks { position: relative; height: 100%; }
.tick { position: absolute; bottom: 4px; transform: translateX(-50%); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tick:first-child { transform: none; }
.row { height: 28px; cursor: default; border-radius: 6px; }
.row:hover, .row.active { background: color-mix(in srgb, var(--grid) 45%, transparent); }
.owner { font: 500 13px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-left: 4px; }
.track { position: relative; height: 100%; }
.gridline { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--grid); }
.gridline.base { background: var(--axis); }
.bar { position: absolute; top: 6px; height: 16px; }
.segm { position: absolute; top: 0; height: 100%; }
.segm.end { border-radius: 0 4px 4px 0; }
.val { font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; display: flex; justify-content: flex-end; align-items: center; gap: 6px; padding-right: 4px; }
.chip { font-size: 11px; font-weight: 500; font-style: normal; border-radius: 999px; padding: 1px 7px; white-space: nowrap; }
.chip.old { background: var(--chip-bg); color: var(--chip-ink); }
.chip.small { background: var(--chip-bg-2); color: var(--chip-ink-2); }
.more { justify-self: start; font: 500 13px var(--sans); color: var(--accent); background: none; border: 0; padding: 4px 0; cursor: pointer; }
.more[hidden] { display: none; }
.more:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.note { font-size: 13px; color: var(--muted); margin: 0; max-width: 75ch; }
.empty { color: var(--muted); font-size: 14px; padding: 12px 4px; }

/* Tooltip */
.tip { position: fixed; z-index: 10; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--ring); border-radius: 8px; box-shadow: 0 6px 24px rgba(0,0,0,0.14); padding: 10px 12px; font-size: 13px; min-width: 200px; max-width: 280px; display: grid; gap: 4px; }
.tip[hidden] { display: none; }
.tip .t-h { font: 600 14px var(--mono); }
.tip .t-r { display: grid; grid-template-columns: 12px 1fr auto; gap: 8px; align-items: center; font-variant-numeric: tabular-nums; }
.tip .t-r span:last-child { text-align: right; }
.tip .t-f { color: var(--muted); font-size: 12px; border-top: 1px solid var(--grid); padding-top: 4px; margin-top: 2px; }

/* Table */
.tablewrap { overflow-x: auto; border: 1px solid var(--grid); border-radius: 8px; max-height: 520px; overflow-y: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--grid); }
th:first-child, td:first-child { text-align: left; }
td:first-child { font-family: var(--mono); }
thead th { position: sticky; top: 0; background: var(--surface); z-index: 1; }
th button { font: 600 12px var(--sans); color: var(--ink-2); background: none; border: 0; padding: 0; cursor: pointer; }
th button[aria-sort="descending"]::after { content: " ↓"; }
th button[aria-sort="ascending"]::after { content: " ↑"; }
details summary { cursor: pointer; font-weight: 500; font-size: 14px; color: var(--ink-2); }
details[open] summary { margin-bottom: 10px; }
footer { font-size: 12px; color: var(--muted); display: grid; gap: 4px; }
footer code { font-family: var(--mono); overflow-wrap: anywhere; }
@media (prefers-reduced-motion: no-preference) { .segm { transition: width .2s ease, left .2s ease; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow" id="eyebrow"></div>
    <h1>__RUDU_REPORT_TITLE__</h1>
    <p class="lede" id="lede"></p>
  </header>

  <div class="warn" id="partial" hidden></div>

  <div class="tiles" id="tiles"></div>

  <section>
    <h2>By source</h2>
    <div class="panel">
      <div class="legend">
        <span><i class="sw" style="background:var(--recent)"></i><span id="leg-recent"></span></span>
        <span><i class="sw" style="background:var(--stale)"></i><span id="leg-stale"></span></span>
      </div>
      <div class="projects" id="projects"></div>
    </div>
  </section>

  <section>
    <h2 id="owners-h">By owner</h2>
    <div class="panel">
      <div class="controls">
        <div class="seg" role="group" aria-label="Measure">
          <button type="button" id="m-storage" aria-pressed="true">Storage</button>
          <button type="button" id="m-inodes" aria-pressed="false">Inodes</button>
        </div>
        <div class="ctl" id="colour-ctl">
          <span class="ctl-label">Colour by</span>
          <div class="seg" role="group" aria-label="Colour by">
            <button type="button" id="c-project" aria-pressed="true">Source</button>
            <button type="button" id="c-age" aria-pressed="false">Access age</button>
          </div>
        </div>
        <input class="search" id="search" type="search" placeholder="Find owner…" aria-label="Find owner" autocomplete="off">
      </div>
      <div class="legend" id="legend"></div>
      <div class="chart" id="chart" role="img" aria-describedby="owners-h"></div>
      <button type="button" class="more" id="more"></button>
      <p class="note" id="note"></p>
    </div>
  </section>

  <section>
    <details class="panel" id="tbl-details">
      <summary id="tbl-summary">Full table</summary>
      <div class="tablewrap"><table id="table"></table></div>
    </details>
  </section>

  <footer id="footer"></footer>
</div>
<div class="tip" id="tip" hidden></div>

<script type="application/json" id="data">__RUDU_REPORT_DATA__</script>
<script>
(function () {
  const D = JSON.parse(document.getElementById("data").textContent);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const P = D.sources.map(s => s.label);
  // Eight fixed categorical slots, assigned in source order so a colour always
  // means the same source. Past eight, sources share a neutral grey rather
  // than generating hues that could not be told apart.
  const COL = Object.fromEntries(P.map((p, i) => [p, i < 8 ? `var(--s${i + 1})` : "var(--other)"]));
  const DAYS = D.purge_days;
  const OLD = `${DAYS}+ days`;
  const $ = id => document.getElementById(id);

  const owners = D.owners.map(o => {
    const bytes = P.reduce((s, p) => s + (o.b[p] || 0), 0);
    const inodes = P.reduce((s, p) => s + (o.i[p] || 0), 0);
    return { ...o, bytes, inodes, recent: bytes - o.stale, avg: o.files ? bytes / o.files : 0 };
  });

  const human = n => {
    const u = ["B", "KB", "MB", "GB", "TB", "PB", "EB"];
    let i = 0;
    while (n >= 1000 && i < u.length - 1) { n /= 1000; i++; }
    return `${n.toFixed(1)} ${u[i]}`;
  };
  const tickBytes = n => {
    if (n === 0) return "0";
    const u = ["B", "KB", "MB", "GB", "TB", "PB", "EB"];
    let i = 0;
    while (n >= 1000 && i < u.length - 1) { n /= 1000; i++; }
    return `${+n.toFixed(1)} ${u[i]}`;
  };
  const compact = n => n >= 1e6 ? `${+(n / 1e6).toFixed(2)}M` : n >= 1e3 ? `${+(n / 1e3).toFixed(n >= 1e5 ? 0 : 1)}k` : `${n}`;
  const comma = n => n.toLocaleString();
  const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
  const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

  // Header
  $("eyebrow").textContent = [D.common_parent, P.join(" "), `scanned ${D.scanned} with rudu ${D.rudu_version}`]
    .filter(Boolean).join(" · ");
  $("lede").textContent = `Who owns the data across ${plural(P.length, "source", "sources")}, how much of it has gone untouched for ${DAYS} days or more, and who is using up the inodes.`;
  $("leg-recent").textContent = `Accessed in the last ${DAYS} days`;
  $("leg-stale").textContent = `Not accessed for ${OLD}`;
  const partial = D.sources.filter(s => s.partial).map(s => s.label);
  if (partial.length) {
    $("partial").hidden = false;
    $("partial").textContent = `The scan of ${partial.join(", ")} stopped early at the memory limit, so its numbers are a lower bound.`;
  }

  // Flags that put state into form
  const mostlyOld = o => o.bytes >= 1e11 && o.stale / o.bytes >= 0.9;
  const smallFiles = o => o.inodes >= 50000 && o.files && o.avg < 5e6;

  // Summary tiles
  const totB = owners.reduce((s, o) => s + o.bytes, 0);
  const totS = owners.reduce((s, o) => s + o.stale, 0);
  const totI = owners.reduce((s, o) => s + o.inodes, 0);
  const tiles = [
    ["Total stored", human(totB), `across ${plural(P.length, "source", "sources")}`],
    [`Not accessed for ${OLD}`, human(totS), `${pct(totS, totB)}% of all data`],
    ["Inodes", compact(totI), `${comma(totI)} files and directories`],
    ["Owners", `${owners.filter(o => o.bytes || o.inodes > 10).length}`, `${owners.length} including directory-only owners`],
  ];
  $("tiles").innerHTML = tiles.map(([l, v, s]) =>
    `<div class="tile"><span class="label">${esc(l)}</span><span class="value">${esc(v)}</span><span class="sub">${esc(s)}</span></div>`).join("");

  // Source strip
  const pMax = Math.max(...D.sources.map(x => x.bytes), 1);
  $("projects").innerHTML = [...D.sources].sort((a, b) => b.bytes - a.bytes).map(x => {
    const w = 100 * x.bytes / pMax, sw = x.bytes ? w * x.stale / x.bytes : 0;
    return `<div class="prow" title="${esc(x.path)}">
      <span class="pname"><i class="sw" style="background:${COL[x.label]}"></i>${esc(x.label)}</span>
      <div class="track" style="height:20px">
        <div class="bar" style="top:2px;width:100%">
          <div class="segm" style="left:0;width:max(1px, calc(${w - sw}% - 2px));background:var(--recent)"></div>
          <div class="segm end" style="left:${w - sw}%;width:${sw}%;background:var(--stale)"></div>
        </div>
      </div>
      <span class="pnum"><b>${human(x.bytes)}</b> · ${pct(x.stale, x.bytes)}% old<br>${compact(x.inodes)} inodes</span>
    </div>`;
  }).join("");

  // Owner chart state
  const state = { measure: "storage", colour: "project", all: false, q: "", sortKey: null, sortDir: -1 };
  const TOP = 25;

  const segmentsFor = o => {
    if (state.measure === "inodes") return P.filter(p => o.i[p]).map(p => ({ k: p, v: o.i[p], c: COL[p] }));
    if (state.colour === "age") return [
      { k: `Accessed in last ${DAYS} days`, v: o.recent, c: "var(--recent)" },
      { k: `Not accessed for ${OLD}`, v: o.stale, c: "var(--stale)" },
    ].filter(s => s.v > 0);
    return P.filter(p => o.b[p]).map(p => ({ k: p, v: o.b[p], c: COL[p] }));
  };
  const total = o => state.measure === "inodes" ? o.inodes : o.bytes;

  const niceStep = raw => {
    const e = Math.pow(10, Math.floor(Math.log10(raw)));
    const f = raw / e;
    return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * e;
  };

  function render() {
    const q = state.q.trim().toLowerCase();
    const sorted = owners.filter(o => total(o) > 0).sort((a, b) => total(b) - total(a));
    const matched = q ? sorted.filter(o => o.o.toLowerCase().includes(q)) : sorted;
    const shown = q || state.all ? matched : matched.slice(0, TOP);

    // Legend
    const leg = state.measure === "storage" && state.colour === "age"
      ? [[`Accessed in last ${DAYS} days`, "var(--recent)"], [`Not accessed for ${OLD}`, "var(--stale)"]]
      : P.map(p => [p, COL[p]]);
    $("legend").innerHTML = leg.map(([k, c]) => `<span><i class="sw" style="background:${c}"></i><span class="${P.includes(k) ? "mono" : ""}">${esc(k)}</span></span>`).join("")
      + (state.measure === "storage"
        ? `<span><i class="chip old">Mostly old</i>90%+ untouched for ${DAYS} days</span>`
        : `<span><i class="chip small">Small files</i>average file under 5 MB</span>`);

    // Scale (shared max of everyone, so the axis does not jump while searching)
    const max = Math.max(...sorted.map(total), 1);
    const step = niceStep(max / 4);
    const top = Math.ceil(max / step) * step;
    const ticks = [];
    for (let v = 0; v <= top + step / 2; v += step) ticks.push(v);
    const fmtTick = state.measure === "inodes" ? compact : tickBytes;
    const gl = ticks.map((v, i) => `<i class="gridline${i === 0 ? " base" : ""}" style="left:${100 * v / top}%"></i>`).join("");

    let html = `<div class="axis"><span></span><div class="ticks">${ticks.map(v => `<span class="tick" style="left:${100 * v / top}%">${fmtTick(v)}</span>`).join("")}</div><span></span></div>`;
    if (!shown.length) html += `<div class="empty">No owner matches “${esc(state.q)}”.</div>`;
    shown.forEach((o, idx) => {
      const segs = segmentsFor(o);
      let cum = 0;
      const bars = segs.map((s, i) => {
        const w = 100 * s.v / top, left = cum;
        cum += w;
        const last = i === segs.length - 1;
        const width = last ? `max(1px, ${w}%)` : `max(1px, calc(${w}% - 2px))`;
        return `<i class="segm${last ? " end" : ""}" style="left:${left}%;width:${width};background:${s.c}"></i>`;
      }).join("");
      let val, chip = "";
      if (state.measure === "inodes") {
        val = compact(o.inodes);
        if (smallFiles(o)) chip = `<i class="chip small">Small files</i>`;
      } else {
        val = human(o.bytes);
        if (mostlyOld(o)) chip = `<i class="chip old">Mostly old</i>`;
      }
      html += `<div class="row" data-i="${owners.indexOf(o)}" tabindex="0">
        <span class="owner" title="${esc(o.o)}">${esc(o.o)}</span>
        <div class="track">${gl}<div class="bar" style="left:0;right:0">${bars}</div></div>
        <span class="val">${chip}<span>${val}</span></span>
      </div>`;
    });
    $("chart").innerHTML = html;
    $("chart").setAttribute("aria-label", `${state.measure === "inodes" ? "Inodes" : "Storage"} by owner, ${shown.length} owners shown`);

    const btn = $("more");
    btn.hidden = !!q || matched.length <= TOP;
    btn.textContent = state.all ? `Show top ${TOP} only` : `Show all ${matched.length} owners`;

    $("note").textContent = state.measure === "inodes"
      ? "Inodes count files and directories. Owners with many small files can usually free inodes by bundling them into tar archives."
      : state.colour === "age"
        ? `Not accessed means no file read for ${DAYS} days or more, based on each file's last access time. Files carrying a 1970 access time (common after archive extraction) count as old.`
        : "Each bar is split by source. Hover or focus a row for the breakdown.";

    $("colour-ctl").hidden = state.measure === "inodes";
    renderTable();
  }

  // Tooltip
  const tip = $("tip");
  function showTip(row, x, y) {
    const o = owners[+row.dataset.i];
    if (!o) return;
    document.querySelectorAll(".row.active").forEach(r => r.classList.remove("active"));
    row.classList.add("active");
    const segs = segmentsFor(o);
    const fmt = state.measure === "inodes" ? comma : human;
    const tot = total(o);
    const foot = state.measure === "inodes"
      ? `${comma(o.files)} files · ${comma(o.dirs)} directories${o.files ? ` · average file ${human(o.avg)}` : ""}`
      : `${human(o.stale)} (${pct(o.stale, o.bytes)}%) not accessed for ${OLD} · ${comma(o.files)} files`;
    tip.innerHTML = `<div class="t-h">${esc(o.o)}</div>`
      + segs.map(s => `<div class="t-r"><i class="sw" style="background:${s.c}"></i><span class="${P.includes(s.k) ? "mono" : ""}">${esc(s.k)}</span><span>${fmt(s.v)} · ${pct(s.v, tot)}%</span></div>`).join("")
      + `<div class="t-r"><i></i><b>Total</b><b>${fmt(tot)}</b></div>`
      + `<div class="t-f">${foot}</div>`;
    tip.hidden = false;
    const r = tip.getBoundingClientRect();
    let left = x + 14, topY = y + 14;
    if (left + r.width > innerWidth - 8) left = Math.max(8, x - r.width - 14);
    if (topY + r.height > innerHeight - 8) topY = Math.max(8, y - r.height - 14);
    tip.style.left = `${left}px`;
    tip.style.top = `${topY}px`;
  }
  function hideTip() {
    tip.hidden = true;
    document.querySelectorAll(".row.active").forEach(r => r.classList.remove("active"));
  }
  $("chart").addEventListener("pointermove", e => {
    const row = e.target.closest(".row");
    row ? showTip(row, e.clientX, e.clientY) : hideTip();
  });
  $("chart").addEventListener("pointerleave", hideTip);
  $("chart").addEventListener("focusin", e => {
    const row = e.target.closest(".row");
    if (row) { const b = row.getBoundingClientRect(); showTip(row, b.left + b.width * 0.4, b.bottom); }
  });
  $("chart").addEventListener("focusout", hideTip);

  // Table
  function renderTable() {
    const inodes = state.measure === "inodes";
    const cols = inodes
      ? [["o", "Owner"], ["inodes", "Inodes"], ["files", "Files"], ["dirs", "Directories"], ["avg", "Avg file"], ...P.map(p => [`i:${p}`, p])]
      : [["o", "Owner"], ["bytes", "Total"], ["stale", `${OLD} old`], ["stalePct", "% old"], ...P.map(p => [`b:${p}`, p])];
    const get = (o, k) => k === "stalePct" ? (o.bytes ? o.stale / o.bytes : 0)
      : k.startsWith("i:") ? (o.i[k.slice(2)] || 0) : k.startsWith("b:") ? (o.b[k.slice(2)] || 0) : o[k];
    const key = state.sortKey && cols.some(c => c[0] === state.sortKey) ? state.sortKey : (inodes ? "inodes" : "bytes");
    const q = state.q.trim().toLowerCase();
    const rows = owners.filter(o => (inodes ? o.inodes : o.bytes) > 0 && (!q || o.o.toLowerCase().includes(q)))
      .sort((a, b) => {
        const x = get(a, key), y = get(b, key);
        return (typeof x === "string" ? x.localeCompare(y) : x - y) * state.sortDir;
      });
    const cell = (o, k) => {
      const v = get(o, k);
      if (k === "o") return esc(v);
      if (k === "stalePct") return `${pct(o.stale, o.bytes)}%`;
      if (!v) return "";
      if (k === "avg") return human(v);
      if (inodes) return comma(v);
      return human(v);
    };
    $("table").innerHTML = `<thead><tr>${cols.map(([k, l]) =>
      `<th scope="col"><button type="button" data-k="${esc(k)}" ${k === key ? `aria-sort="${state.sortDir < 0 ? "descending" : "ascending"}"` : ""} class="${P.includes(l) ? "mono" : ""}">${esc(l)}</button></th>`).join("")}</tr></thead>
      <tbody>${rows.map(o => `<tr>${cols.map(([k]) => `<td>${cell(o, k)}</td>`).join("")}</tr>`).join("")}</tbody>`;
    $("tbl-summary").textContent = `Full table · ${inodes ? "inodes" : "storage"} · ${rows.length} owners`;
  }
  $("table").addEventListener("click", e => {
    const b = e.target.closest("button[data-k]");
    if (!b) return;
    const k = b.dataset.k;
    if (state.sortKey === k) state.sortDir *= -1;
    else { state.sortKey = k; state.sortDir = k === "o" ? 1 : -1; }
    renderTable();
  });

  // Controls
  const setPressed = (on, off) => { $(on).setAttribute("aria-pressed", "true"); $(off).setAttribute("aria-pressed", "false"); };
  $("m-storage").onclick = () => { state.measure = "storage"; state.sortKey = null; state.sortDir = -1; setPressed("m-storage", "m-inodes"); render(); };
  $("m-inodes").onclick = () => { state.measure = "inodes"; state.sortKey = null; state.sortDir = -1; setPressed("m-inodes", "m-storage"); render(); };
  $("c-project").onclick = () => { state.colour = "project"; setPressed("c-project", "c-age"); render(); };
  $("c-age").onclick = () => { state.colour = "age"; setPressed("c-age", "c-project"); render(); };
  $("more").onclick = () => { state.all = !state.all; render(); };
  $("search").addEventListener("input", e => { state.q = e.target.value; render(); });

  // Footer
  $("footer").innerHTML = [
    "Sizes are disk usage in decimal units (1 TB = 10¹² bytes), summed over each file's owner. Inodes are files plus directories, each counted for its own owner.",
    `“Not accessed” uses each file's last access time against a ${DAYS}-day threshold (<code>--purge-days</code>). Results restored from rudu's cache can over-state age, never under-state it; use <code>--no-cache</code> for exact values.`,
    "Hard-linked files count once, as in <code>du</code>. Directories' own blocks are not attributed to an owner.",
    `Sources: ${D.sources.map(s => `<code>${esc(s.label)}</code> = <code>${esc(s.path)}</code>`).join(", ")}.`,
    `Generated by <code>${esc(D.command)}</code>`,
  ].map(t => `<div>${t}</div>`).join("");

  render();
})();
</script>
</body>
</html>
