name: Release

# Triggered when a version tag is pushed (e.g. v1.5.0).
#
# The test job below re-runs the suite against the tagged commit rather than
# trusting that CI was green on main: a tag can point at any commit, and
# shipping binaries built from an untested one is the failure this guards.
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  # ── Verify the tagged commit ─────────────────────────────────────────────────
  test:
    name: Test tagged commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          key: release-test

      - name: Test
        run: cargo test --verbose

      # The tag and the crate version must agree, or `cargo install rudu` and
      # the published binaries end up describing different builds. rudu also
      # stamps its version into every cache file header and invalidates on
      # mismatch, so a wrong version silently changes cache behaviour.
      - name: Verify tag matches Cargo.toml version
        run: |
          crate_version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[0].version')
          tag_version="${GITHUB_REF_NAME#v}"
          echo "Cargo.toml: $crate_version"
          echo "Tag:        $tag_version"
          if [ "$crate_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $crate_version"
            exit 1
          fi

  # ── Release binary builds ────────────────────────────────────────────────────
  build-release:
    name: Release binary (${{ matrix.target }})
    needs: [test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Statically linked musl builds are the DEFAULT Linux assets. They
          # have no libc dependency, so they run on old enterprise Linux (NCI
          # Gadi is Rocky 8 / glibc 2.28) as well as on modern distros. A
          # glibc-linked binary built on the oldest available runner (Ubuntu
          # 22.04, glibc 2.35) fails there with "GLIBC_2.34 not found".
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            artifact: rudu-linux-x86_64

          - os: ubuntu-22.04
            target: aarch64-unknown-linux-musl
            artifact: rudu-linux-aarch64

          # glibc build kept as a suffixed extra: musl's allocator is slower
          # under heavy multi-threaded allocation, so anyone on a modern distro
          # who wants the last few percent can take this one instead.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: rudu-linux-x86_64-gnu

          - os: macos-14
            target: aarch64-apple-darwin
            artifact: rudu-macos-arm64

          # An Intel macOS build (x86_64-apple-darwin on the macos-13 runner)
          # would slot in here, at the cost of blocking every binary in the
          # release if that runner image is retired.

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      # No `cross` or musl-gcc needed: .cargo/config.toml points the musl
      # targets at rust-lld, which links them natively on any host.
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      # A Linux asset that silently depends on a newer glibc than the target
      # system is exactly the bug this matrix exists to prevent, so assert that
      # the musl builds really are static before publishing them.
      - name: Verify musl binaries are statically linked
        if: contains(matrix.target, 'musl')
        run: |
          bin=target/${{ matrix.target }}/release/rudu
          file "$bin"
          if readelf -l "$bin" | grep -q INTERP; then
            echo "::error::$bin requests a dynamic loader; it is not static"
            exit 1
          fi
          if readelf -V "$bin" 2>/dev/null | grep -q GLIBC_; then
            echo "::error::$bin still references GLIBC symbols"
            exit 1
          fi
          echo "OK: statically linked, no glibc dependency"

      - name: Stage binary
        run: |
          cp target/${{ matrix.target }}/release/rudu ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}

      # HPC users often fetch these onto a login node over plain HTTP proxies,
      # so publish a checksum they can verify against.
      - name: Checksum
        run: shasum -a 256 ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256

  # ── GitHub Release ────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-22.04
    needs: [build-release]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  # ── crates.io publish ─────────────────────────────────────────────────────────
  # Deliberately disabled: releases are published as binaries only. Enable by
  # uncommenting and adding a CARGO_REGISTRY_TOKEN secret.
  #publish-crates:
  #  name: Publish to crates.io
  #  runs-on: ubuntu-22.04
  #  needs: [build-release]
  #  steps:
  #    - uses: actions/checkout@v4
  #    - uses: dtolnay/rust-toolchain@stable
  #    - name: Publish
  #      run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
