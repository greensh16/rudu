name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # Allows re-running the checks by hand without pushing a commit.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Superseded PR runs are cancelled so a burst of commits does not queue several
# full matrices. Pushes to main are never cancelled: every commit on main keeps
# its own result, so a later green run cannot hide which commit broke a build.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Build and test ───────────────────────────────────────────────────────────
  # Run on both platforms rudu claims to support: it makes raw `lstat` calls,
  # resolves UIDs through libc, and reads RSS per-platform, so a Linux-only run
  # would not exercise the macOS code paths at all.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.os }}

      # --all-targets so benches and examples are compiled too, not just the
      # library and binary. They build `Args` and cache entries against the
      # library API and have silently rotted out of sync with it before, and
      # some of their platform code is macOS-only so a Linux-only check would
      # miss it. Debug profile, so this stays much cheaper than `cargo bench`.
      - name: Build (including tests, benches, examples)
        run: cargo build --all-targets --verbose

      # Covers unit, integration, and doc tests in one invocation.
      - name: Test
        run: cargo test --verbose

  # ── Format, lint, docs ───────────────────────────────────────────────────────
  # Platform-independent, so run once rather than per-OS.
  lint:
    name: Format, lint, docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          key: lint

      - name: Check formatting
        run: cargo fmt --check

      # --all-targets so tests, benches, and examples are linted too, not just
      # the library and binary.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Check documentation
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      # Release Linux assets are statically linked musl builds, so that they run
      # on old enterprise Linux (HPC systems lag years behind). Type-check that
      # target here so a musl-breaking change fails a PR rather than a release.
      - name: Check the musl target still builds
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo check --target x86_64-unknown-linux-musl --all-targets

  # ── Performance ──────────────────────────────────────────────────────────────
  # Times the PR's release build against its base branch's on the same runner,
  # interleaving runs so runner drift hits both equally, and checks that JSON
  # output costs no more than CSV. Thresholds (20% regression, 10% JSON
  # overhead) are looser than the targets because hosted runners are noisy;
  # what this exists to catch — an extra syscall per entry, a quadratic loop —
  # shows up far above that. See scripts/perf_check.py.
  perf:
    name: Performance
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          key: perf
          workspaces: |
            . -> target
            base -> target

      - name: Build PR head (release)
        run: cargo build --release

      - name: Build base branch (release)
        run: |
          git worktree add base "${{ github.event.pull_request.base.sha }}"
          cargo build --release --manifest-path base/Cargo.toml

      - name: Compare
        run: |
          python3 scripts/perf_check.py \
            --head target/release/rudu \
            --base base/target/release/rudu
