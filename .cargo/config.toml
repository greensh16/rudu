# Static musl builds, so release binaries run on older enterprise Linux.
#
# HPC systems lag well behind: NCI's Gadi is Rocky 8 (glibc 2.28), while the
# oldest available GitHub runner is Ubuntu 22.04 (glibc 2.35). A glibc-linked
# binary built in CI therefore fails on Gadi with "GLIBC_2.34 not found". A
# statically linked musl binary has no libc dependency at all and runs anywhere.
#
# `rust-lld` is used as the linker so these targets cross-compile with nothing
# but a rustup target installed — no musl-gcc, no `cross`, no container.
[target.x86_64-unknown-linux-musl]
linker = "rust-lld"

[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
